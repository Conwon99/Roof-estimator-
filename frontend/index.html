<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roof Size Estimator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin 0.8s linear infinite; }
    .fade-in { animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* Debug panel */
    .debug-tab {
      font-family: ui-monospace, monospace;
      font-size: 0.7rem;
      padding: 0.3rem 0.75rem;
      border-radius: 0.375rem 0.375rem 0 0;
      color: #94a3b8;
      border: none;
      background: transparent;
      cursor: pointer;
      transition: color 0.15s, background 0.15s;
    }
    .debug-tab:hover { color: #e2e8f0; }
    .debug-tab.active-tab { color: #38bdf8; background: rgba(56,189,248,0.08); }

    .debug-panel {
      padding: 0.875rem 1rem;
      font-family: ui-monospace, 'Cascadia Code', monospace;
      font-size: 0.72rem;
      line-height: 1.6;
      color: #94a3b8;
      overflow-x: auto;
      max-height: 320px;
      overflow-y: auto;
      white-space: pre;
    }

    /* JSON syntax highlighting */
    .j-key   { color: #7dd3fc; }   /* sky-300  – keys */
    .j-str   { color: #86efac; }   /* green-300 – strings */
    .j-num   { color: #fda4af; }   /* rose-300 – numbers */
    .j-bool  { color: #c4b5fd; }   /* violet-300 – booleans */
    .j-null  { color: #f9a8d4; }   /* pink-300 – null */
    .j-punc  { color: #64748b; }   /* slate-500 – punctuation */
  </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans">

  <div class="max-w-xl mx-auto px-4 py-14">

    <!-- Header -->
    <div class="text-center mb-10">
      <div class="inline-flex items-center justify-center w-14 h-14 bg-blue-600 rounded-2xl mb-4 shadow-md">
        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M3 12l9-9 9 9M5 10v9a1 1 0 001 1h4v-5h4v5h4a1 1 0 001-1v-9"/>
        </svg>
      </div>
      <h1 class="text-3xl font-bold text-slate-800 tracking-tight">Roof Size Estimator</h1>
      <p class="mt-2 text-slate-500 text-sm">
        Enter a property address to estimate roof area using building footprint data.
      </p>
    </div>

    <!-- Form card -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 mb-5">
      <form id="form" novalidate>

        <div class="mb-5">
          <label for="address" class="block text-sm font-medium text-slate-700 mb-1.5">
            Property Address
          </label>
          <input
            id="address"
            type="text"
            placeholder="e.g. 1600 Pennsylvania Ave NW, Washington, DC"
            autocomplete="street-address"
            class="w-full px-4 py-3 rounded-xl border border-slate-200 text-slate-800 placeholder-slate-400
                   focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent
                   transition text-sm"
          />
          <p id="addr-error" class="hidden mt-1.5 text-xs text-red-500">Please enter an address.</p>
        </div>

        <div class="mb-6">
          <label for="pitch" class="block text-sm font-medium text-slate-700 mb-1.5">
            Roof Pitch
            <span class="ml-1 text-slate-400 font-normal">(used to calculate surface area)</span>
          </label>
          <select
            id="pitch"
            class="w-full px-4 py-3 rounded-xl border border-slate-200 text-slate-800 bg-white
                   focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent
                   transition text-sm"
          >
            <option value="flat">Flat (0:12) — ×1.00 — commercial / flat modern</option>
            <option value="low_2_12">Low (2:12) — ×1.01 — low-slope residential</option>
            <option value="standard_4_12" selected>Standard (4:12) — ×1.05 — typical residential ✓</option>
            <option value="moderate_6_12">Moderate (6:12) — ×1.12 — traditional gable</option>
            <option value="steep_9_12">Steep (9:12) — ×1.25 — high-pitched</option>
            <option value="very_steep_12_12">Very Steep (12:12) — ×1.41 — steep gable</option>
          </select>
        </div>

        <button
          id="btn"
          type="submit"
          class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold
                 py-3 px-6 rounded-xl transition-colors flex items-center justify-center gap-2 text-sm"
        >
          <span id="btn-icon">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 11h.01M12 11h.01M15 11h.01M4 19h16a2 2 0 002-2V7a2 2 0 00-2-2H4a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>
          </span>
          <span id="btn-text">Estimate Roof Size</span>
        </button>
      </form>
    </div>

    <!-- Results (hidden until estimate runs) -->
    <div id="results" class="hidden fade-in"></div>

    <!-- Debug panel (hidden until estimate runs) -->
    <div id="debug-wrap" class="hidden mt-4 fade-in">
      <details id="debug-details" class="group bg-slate-900 rounded-2xl overflow-hidden border border-slate-700">
        <summary class="flex items-center justify-between px-5 py-3 cursor-pointer select-none
                        text-xs font-mono text-slate-400 hover:text-slate-200 transition-colors list-none">
          <span class="flex items-center gap-2">
            <svg class="w-3.5 h-3.5 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
            </svg>
            <span id="debug-label">Debug</span>
          </span>
          <svg class="w-4 h-4 transition-transform group-open:rotate-180" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
          </svg>
        </summary>

        <div class="border-t border-slate-700">
          <!-- Tab bar -->
          <div class="flex border-b border-slate-700 px-1 pt-1 gap-1">
            <button data-tab="request"  class="debug-tab active-tab">Request</button>
            <button data-tab="response" class="debug-tab">Response</button>
            <button data-tab="timing"   class="debug-tab">Timing</button>
          </div>

          <!-- Tab panels -->
          <div id="tab-request"  class="debug-panel"></div>
          <div id="tab-response" class="debug-panel hidden"></div>
          <div id="tab-timing"   class="debug-panel hidden"></div>
        </div>
      </details>
    </div>

    <!-- How it works -->
    <div class="mt-8 text-xs text-slate-400 text-center space-y-0.5">
      <p>Building footprints sourced from <a href="https://www.openstreetmap.org" target="_blank" class="underline hover:text-slate-600">OpenStreetMap</a>.</p>
      <p>Addresses geocoded with <a href="https://nominatim.org" target="_blank" class="underline hover:text-slate-600">Nominatim</a>. No API key required.</p>
    </div>

  </div><!-- /container -->

  <script>
    const form       = document.getElementById('form');
    const results    = document.getElementById('results');
    const debugWrap  = document.getElementById('debug-wrap');
    const debugLabel = document.getElementById('debug-label');
    const btn        = document.getElementById('btn');
    const btnText    = document.getElementById('btn-text');
    const btnIcon    = document.getElementById('btn-icon');
    const addrInput  = document.getElementById('address');
    const addrError  = document.getElementById('addr-error');

    // ── Tab switching ─────────────────────────────────────────────────────────
    document.querySelectorAll('.debug-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.debug-tab').forEach(t => t.classList.remove('active-tab'));
        document.querySelectorAll('.debug-panel').forEach(p => p.classList.add('hidden'));
        tab.classList.add('active-tab');
        document.getElementById('tab-' + tab.dataset.tab).classList.remove('hidden');
      });
    });

    // ── JSON syntax highlighter ───────────────────────────────────────────────
    function highlight(obj) {
      const raw = JSON.stringify(obj, null, 2);
      return raw
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(
          /("(\\u[\dA-Fa-f]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+\.?\d*([eE][+-]?\d+)?)/g,
          match => {
            if (/^".*":$/.test(match))   return `<span class="j-key">${match}</span>`;
            if (/^"/.test(match))        return `<span class="j-str">${match}</span>`;
            if (/true|false/.test(match))return `<span class="j-bool">${match}</span>`;
            if (/null/.test(match))      return `<span class="j-null">${match}</span>`;
            return `<span class="j-num">${match}</span>`;
          }
        )
        .replace(/([{}\[\],])/g, '<span class="j-punc">$1</span>');
    }

    function setDebug(requestBody, responseData, timing) {
      document.getElementById('tab-request').innerHTML  = highlight(requestBody);
      document.getElementById('tab-response').innerHTML = highlight(responseData);

      const rows = [
        ['Total round-trip', `${timing.total} ms`],
        ['Status', timing.status],
        ['Geocoded',   responseData.latitude  ? `${responseData.latitude}, ${responseData.longitude}` : '—'],
        ['OSM element', responseData.osm_id   ? `way/${responseData.osm_id}` : '—'],
        ['Confidence', responseData.confidence || '—'],
        ['Timestamp',  new Date().toISOString()],
      ];

      document.getElementById('tab-timing').innerHTML = rows
        .map(([k, v]) =>
          `<span class="j-key">${k.padEnd(18)}</span>  <span class="j-str">"${v}"</span>`
        ).join('\n');

      // Reset to Request tab each time
      document.querySelectorAll('.debug-tab').forEach(t => t.classList.remove('active-tab'));
      document.querySelectorAll('.debug-panel').forEach(p => p.classList.add('hidden'));
      document.querySelector('[data-tab="request"]').classList.add('active-tab');
      document.getElementById('tab-request').classList.remove('hidden');

      debugLabel.textContent = `Debug  ·  ${timing.total} ms  ·  ${timing.status}`;
      debugWrap.classList.remove('hidden');
    }

    // ── Spinner / button helpers ──────────────────────────────────────────────
    const SPINNER = `<svg class="w-4 h-4 spin" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"/>
    </svg>`;

    const CALC_ICON = `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 11h.01M12 11h.01M15 11h.01M4 19h16a2 2 0 002-2V7a2 2 0 00-2-2H4a2 2 0 00-2 2v10a2 2 0 002 2z"/>
    </svg>`;

    function setLoading(on) {
      btn.disabled = on;
      btnText.textContent = on ? 'Estimating…' : 'Estimate Roof Size';
      btnIcon.innerHTML   = on ? SPINNER : CALC_ICON;
    }

    // ── Result card helpers ───────────────────────────────────────────────────
    function stat(label, value, sub) {
      return `
        <div class="bg-slate-50 rounded-xl px-5 py-4 flex flex-col gap-0.5">
          <span class="text-xs font-medium text-slate-500 uppercase tracking-wide">${label}</span>
          <span class="text-2xl font-bold text-slate-800">${value}</span>
          ${sub ? `<span class="text-xs text-slate-400">${sub}</span>` : ''}
        </div>`;
    }

    function renderSuccess(d) {
      const mapsUrl = `https://www.google.com/maps/@${d.latitude},${d.longitude},18z/data=!3m1!1e3`;
      const osmUrl  = `https://www.openstreetmap.org/way/${d.osm_id}`;
      return `
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 fade-in">
          <div class="flex items-start gap-3 mb-6">
            <span class="mt-0.5 flex-shrink-0 w-5 h-5 text-green-500">
              <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
              </svg>
            </span>
            <div>
              <p class="text-sm font-semibold text-slate-700">Building footprint found</p>
              <p class="text-xs text-slate-400 mt-0.5">${d.formatted_address}</p>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3 mb-5">
            ${stat('Estimated Roof Area', `${d.roof_sqft.toLocaleString()} ft²`, `${d.roof_m2.toLocaleString()} m²`)}
            ${stat('Building Footprint',  `${d.footprint_sqft.toLocaleString()} ft²`, `${d.footprint_m2.toLocaleString()} m²`)}
            ${stat('Pitch Applied', d.pitch_label, `×${d.pitch_factor} slope factor`)}
            ${stat('Storeys', d.floors, 'from OSM data')}
          </div>
          <div class="flex gap-2 flex-wrap">
            <a href="${mapsUrl}" target="_blank"
               class="flex-1 min-w-[140px] text-center text-xs font-medium text-blue-600 border border-blue-200
                      bg-blue-50 hover:bg-blue-100 rounded-lg py-2 px-3 transition-colors">
              View Satellite →
            </a>
            <a href="${osmUrl}" target="_blank"
               class="flex-1 min-w-[140px] text-center text-xs font-medium text-slate-600 border border-slate-200
                      bg-slate-50 hover:bg-slate-100 rounded-lg py-2 px-3 transition-colors">
              View on OpenStreetMap →
            </a>
          </div>
        </div>`;
    }

    function renderNotFound(d) {
      const mapsUrl = `https://www.google.com/maps/@${d.latitude},${d.longitude},18z/data=!3m1!1e3`;
      return `
        <div class="bg-white rounded-2xl shadow-sm border border-amber-200 p-8 fade-in">
          <div class="flex items-start gap-3 mb-4">
            <span class="mt-0.5 flex-shrink-0 w-5 h-5 text-amber-500">
              <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732
                     4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
              </svg>
            </span>
            <div>
              <p class="text-sm font-semibold text-slate-700">Address found — building data unavailable</p>
              <p class="text-xs text-slate-400 mt-0.5">${d.formatted_address}</p>
            </div>
          </div>
          <p class="text-sm text-slate-600 mb-5">${d.message}</p>
          <a href="${mapsUrl}" target="_blank"
             class="inline-flex text-xs font-medium text-blue-600 border border-blue-200
                    bg-blue-50 hover:bg-blue-100 rounded-lg py-2 px-4 transition-colors">
            Open Satellite View for Manual Measurement →
          </a>
        </div>`;
    }

    function renderError(msg) {
      return `
        <div class="bg-white rounded-2xl shadow-sm border border-red-200 p-8 fade-in">
          <div class="flex items-start gap-3">
            <span class="mt-0.5 flex-shrink-0 w-5 h-5 text-red-500">
              <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/>
              </svg>
            </span>
            <div>
              <p class="text-sm font-semibold text-slate-700">Error</p>
              <p class="text-sm text-slate-500 mt-0.5">${msg}</p>
            </div>
          </div>
        </div>`;
    }

    // ── Form submit ───────────────────────────────────────────────────────────
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const address = addrInput.value.trim();
      if (!address) {
        addrError.classList.remove('hidden');
        addrInput.focus();
        return;
      }
      addrError.classList.add('hidden');

      const pitch       = document.getElementById('pitch').value;
      const requestBody = { address, pitch };

      setLoading(true);
      results.classList.remove('hidden');
      results.innerHTML = `<div class="flex justify-center py-10">
        <svg class="w-8 h-8 spin text-blue-500" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"/>
        </svg>
      </div>`;

      const t0 = performance.now();
      let httpStatus = '—';

      try {
        const res = await fetch('/api/estimate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(requestBody),
        });

        const elapsed = Math.round(performance.now() - t0);
        httpStatus = `${res.status} ${res.statusText}`;

        if (!res.ok) {
          const err = await res.json().catch(() => ({ detail: 'Unknown error' }));
          results.innerHTML = renderError(err.detail || `HTTP ${res.status}`);
          setDebug(requestBody, err, { total: elapsed, status: httpStatus });
          return;
        }

        const data = await res.json();
        results.innerHTML = data.success ? renderSuccess(data) : renderNotFound(data);
        setDebug(requestBody, data, { total: elapsed, status: httpStatus });

      } catch (err) {
        const elapsed = Math.round(performance.now() - t0);
        results.innerHTML = renderError('Could not reach the server. Is it running?');
        setDebug(requestBody, { error: err.message }, { total: elapsed, status: 'Network error' });
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>

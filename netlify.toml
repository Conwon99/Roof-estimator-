[build]
  publish = "frontend"
  functions = "netlify/functions"

# Extend function timeout to 26 s (Netlify max) to accommodate
# the two serial HTTP calls (Nominatim + OSM API).
[functions."api"]
  timeout = 26

# Route all /api/* requests to the serverless function.
# :splat passes the matched path segment to the function, so
# /api/estimate → /.netlify/functions/api/estimate → event.path = "/estimate"
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA fallback (keeps direct-link refreshes working).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
